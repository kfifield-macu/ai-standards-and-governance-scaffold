apiVersion: agent-standards/v1
default: deny
tools:
  - tool: newrelic
    operations: [nrql.query, entity.search]
  - tool: octopus
    operations: [release.list, deployment.status, deployment.redeploy]
paths:
  read: ["**"]
  write: []
network:
  egress: ["api.newrelic.com", "*.octopus.app"]
attach_sources: [runbook, incident-ticket]
rules:
  - name: no-writes-outside-dev
    enforcement: enforced
    expression: >-
      tool_call.risk != "read" && target.environment != "dev"
    decision: approve
    message: "Writes outside dev need human approval."
  - name: no-destructive
    enforcement: enforced
    expression: >-
      tool_call.risk == "destructive"
    decision: deny
    message: "Troubleshooting never runs destructive operations."
