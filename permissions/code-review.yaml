apiVersion: agent-standards/v1
default: deny
tools:
  - tool: git
    operations: [diff, log]
paths:
  read: ["**"]
  write: []
network:
  egress: []
attach_sources: [diff, CONTRIBUTING.md, style-guide]
rules:
  - name: read-only-capability
    enforcement: enforced
    expression: >-
      tool_call.risk != "read"
    decision: deny
    message: "code-review is read-only."
